<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Management System - Login</title>


<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/login.css">

</head>

<body>

	<div class="container">

	

		<div class="left-panel">

			<div class="brand">

				<i class="fa-solid fa-heart-pulse"></i>

				<h2>MediCare</h2>

			</div>


			<div class="welcome">

				<h1>Welcome Back</h1>

				<p>Manage appointments, patient records and hospital services
					securely from one place. Your healthcare dashboard is always ready
					when you are.</p>

			</div>


		
			<div class="heartbeat">

				<svg viewBox="0 0 500 100" preserveAspectRatio="none">

                    <path
						d="M0 50
                             L70 50
                             L95 50
                             L115 15
                             L135 85
                             L155 20
                             L180 50
                             L250 50
                             L280 40
                             L300 60
                             L330 50
                             L500 50" />

                </svg>

			</div>


		

		</div>




		<div class="right-panel">

			<div class="login-card">

				<!-- Toggle -->

				<div class="toggle">

					<button class="active">Sign In</button>

					<button id="registerBtn">Register</button>

				</div>


				

				<div class="heading">

					<h2>Sign In</h2>

					<p>Login to continue to your dashboard.</p>

				</div>


				

				<form id="loginForm">

				

					<div class="input-box">

						<i class="fa-solid fa-envelope"></i> <input type="email"
							id="email" placeholder="Email Address" required>

					</div>


					

					<div class="input-box">

						<i class="fa-solid fa-lock"></i> <input type="password"
							id="password" placeholder="Password" required>

					</div>


				

					<div class="remember">

						<label> <input type="checkbox"> Remember Me

						</label> <a href="#"> Forgot Password? </a>

					</div>


					

					<button type="submit" class="login-btn">Sign In</button>

				</form>



				<div class="register">

					<p>

						Don't have an account? <a href="register.html"> Register </a>

					</p>

				</div>

			</div>

		</div>

	</div>


	<script src="../js/login.js"></script>

</body>

</html>
