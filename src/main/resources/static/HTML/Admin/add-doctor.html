<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Doctor</title>

<link rel="stylesheet" href="../../css/Admin/add-doctor.css">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

	<div class="container">

		<div class="form-box">

			<div class="top-bar">

				<a href="admin-dashboard.html"> <i
					class="fa-solid fa-arrow-left"></i> Back To Dashboard

				</a>

			</div>

			<h2>

				<i class="fa-solid fa-user-doctor"></i> Add Doctor

			</h2>

			<form id="doctorForm">

				<div class="input-box">

					<i class="fa-solid fa-user"></i> <input type="text" id="doctorName"
						placeholder="Doctor Name" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-envelope"></i> <input type="email" id="email"
						placeholder="Email" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-lock"></i> <input type="password"
						id="password" placeholder="Password" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-phone"></i> <input type="text" id="phone"
						placeholder="Phone Number" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-venus-mars"></i> <select id="gender" required>

						<option value="">Select Gender</option>

						<option value="Male">Male</option>

						<option value="Female">Female</option>

						<option value="Other">Other</option>

					</select>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-stethoscope"></i> <input type="text"
						id="specialization" placeholder="Specialization" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-graduation-cap"></i> <input type="text"
						id="qualification" placeholder="Qualification" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-briefcase"></i> <input type="number"
						id="experience" placeholder="Experience (Years)" min="0" required>

				</div>

				<div class="input-box">

					<i class="fa-solid fa-location-dot"></i>

					<textarea id="address" rows="4" placeholder="Address" required></textarea>

				</div>

				<div class="button-group">

					<button type="submit">

						<i class="fa-solid fa-user-plus"></i> Register Doctor

					</button>

					<button type="reset">

						<i class="fa-solid fa-rotate-left"></i> Reset

					</button>

				</div>

			</form>

		</div>

	</div>

	<script src="../../js/Admin/add-doctor.js"></script>

</body>

</html>
